# This workflow builds and pushes a container image to Alibaba Cloud Container Registry (ACR),
# and then deploys it to Alibaba Cloud Container Service for Kubernetes (ACK).

name: Build and Deploy to ACK

on:
  push:
    branches: [ "main" ]

env:
  REGION_ID: ${{ vars.REGION_ID }}
  REGISTRY: ${{ vars.REGISTRY }}
  NAMESPACE: ${{ vars.NAMESPACE }}
  IMAGE: ${{ github.event.repository.name }}
  TAG: ${{ github.sha }}
  ACK_CLUSTER_ID: ${{ vars.ACK_CLUSTER_ID }}
  ACK_DEPLOYMENT_NAME: ${{ github.event.repository.name }}
  ACR_EE_REGISTRY: ${{ vars.ACR_EE_REGISTRY }}
  ACR_EE_NAMESPACE: ${{ vars.ACR_EE_NAMESPACE }}
  ACR_EE_IMAGE: ${{ github.event.repository.name }}
  ACR_EE_TAG: ${{ github.sha }}
  ACR_EE_INSTANCE_ID: ${{ vars.ACR_EE_INSTANCE_ID }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. Login to Alibaba Cloud Container Registry (ACR)
      - name: Login to ACR
        uses: aliyun/acr-login@v1
        with:
          login-server: "https://${{ env.REGISTRY }}"
          region-id: "${{ env.REGION_ID }}"
          access-key-id: "${{ secrets.ACCESS_KEY_ID }}"
          access-key-secret: "${{ secrets.ACCESS_KEY_SECRET }}"

      # 2. Build and push image to ACR
      - name: Build and push image to ACR
        run: |
          docker build --tag "$REGISTRY/$NAMESPACE/$IMAGE:$TAG" .
          docker push "$REGISTRY/$NAMESPACE/$IMAGE:$TAG"

      # 3. Scan image in ACR
      - name: Scan image in ACR
        uses: aliyun/acr-scan@v1
        with:
          region-id: "${{ env.REGION_ID }}"
          access-key-id: "${{ secrets.ACCESS_KEY_ID }}"
          access-key-secret: "${{ secrets.ACCESS_KEY_SECRET }}"
          repository: "${{ env.NAMESPACE }}/${{ env.IMAGE }}"
          tag: "${{ env.TAG }}"

      # 4. Set ACK context
      - name: Set K8s context
        uses: aliyun/ack-set-context@v1
        with:
          access-key-id: "${{ secrets.ACCESS_KEY_ID }}"
          access-key-secret: "${{ secrets.ACCESS_KEY_SECRET }}"
          cluster-id: "${{ env.ACK_CLUSTER_ID }}"

      # 5. Set up Kustomize
      - name: Set up Kustomize
        run: |
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash /dev/stdin 3.8.6

      # 6. Deploy to ACK cluster
      - name: Deploy
        run: |
          ./kustomize edit set image REGISTRY/NAMESPACE/IMAGE:TAG=$REGISTRY/$NAMESPACE/$IMAGE:$TAG
          ./kustomize build . | kubectl apply -f -
          kubectl rollout status deployment/$ACK_DEPLOYMENT_NAME
          kubectl get services -o wide
